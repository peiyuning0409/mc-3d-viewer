.thumb{width:30px;height:30px;border-radius:3px;margin-right:8px;flex-shrink:0;image-rendering:pixelated;background-size:542px 524px}
#main{flex:1;position:relative}
#cv{width:100%;height:100%}

#info h2{font-size:14px;color:#8ac;margin-bottom:2px}
#info span{font-size:10px;color:#556}
#hint{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:9px;color:#334;pointer-events:none}

#count{position:absolute;top:14px;left:14px;font-size:12px;color:#334;background:rgba(8,8,20,.7);padding:5px 12px;border-radius:6px}

const ATLAS_URL = 'atlas.png';
const ATLAS_W = 542, ATLAS_H = 524, ROWS = 30;

// ---- THREE.JS SETUP ----
const cv = document.getElementById('cv');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 60);
camera.position.set(3, 2.2, 3.5);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.75;
controls.target.set(0, 0, 0);

// Lights
scene.add(new THREE.AmbientLight('#445566', 2.8));
const key = new THREE.DirectionalLight('#ffffff', 3.5);
key.position.set(5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
scene.add(key);
scene.add(new THREE.DirectionalLight('#4488cc', 1.8).position.set(-3, 3, -3));
scene.add(new THREE.DirectionalLight('#886644', 0.8).position.set(0, -0.3, 2));

// Ground
const grid = new THREE.GridHelper(8, 16, '#2a3a5a', '#0a0a1a');
grid.position.y = -1;
scene.add(grid);
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({opacity:0.25}));
shadowPlane.rotation.x = -Math.PI/2;
shadowPlane.position.y = -1.01;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

// Stars
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(600*3);
for(let i=0;i<600;i++){sp[i*3]=(Math.random()-.5)*20;sp[i*3+1]=Math.random()*10+1;sp[i*3+2]=(Math.random()-.5)*20}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({color:'#447799', size:.02, transparent:true, opacity:.5}));
scene.add(stars);

// ---- TEXTURE ATLAS ----
let atlasTex = null;
const atlasImg = new Image();
atlasImg.crossOrigin = 'anonymous';
atlasImg.onload = () => {
  const c = document.createElement('canvas');
  c.width = ATLAS_W;
  c.height = ATLAS_H;
  c.getContext('2d').drawImage(atlasImg, 0, 0);
  atlasTex = new THREE.CanvasTexture(c);
  atlasTex.colorSpace = THREE.SRGBColorSpace;
  atlasTex.magFilter = THREE.NearestFilter;
  atlasTex.minFilter = THREE.LinearMipmapLinearFilter;
  atlasTex.generateMipmaps = true;
  document.getElementById('load').style.display = 'none';
  renderList();
  if(shown.length) selectBlock(shown[0]);
};
atlasImg.onerror = () => { document.getElementById('load').textContent = '纹理加载失败，请刷新重试'; };
atlasImg.src = ATLAS_URL;

// ---- MATERIAL CACHE ----
const matCache = new Map();
function getBlockMat(idx) {
  if(matCache.has(idx)) return matCache.get(idx);
  const b = BLOCKS[idx];
  const mat = new THREE.MeshStandardMaterial({roughness:.55, metalness:.02});
  if(atlasTex) {
    mat.map = atlasTex;
    const uv = b.uv;
    mat.map.offset.set(uv[0], uv[1]);
    mat.map.repeat.set(uv[2]-uv[0], uv[3]-uv[1]);
    mat.map.wrapS = THREE.ClampToEdgeWrapping;
    mat.map.wrapT = THREE.ClampToEdgeWrapping;
  }
  matCache.set(idx, mat);
  return mat;
}

// ---- 3D OBJECT ----
let curObj = null;
function showBlock(idx) {
  if(curObj) { scene.remove(curObj); curObj.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material&&c.material!==atlasTex)c.material.dispose()}); curObj=null; }
  const mat = getBlockMat(idx);
  const mats = [mat, mat, mat, mat, mat, mat];
  const group = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1,1,1,2,2,2), mats);
  box.castShadow = true; box.receiveShadow = true;
  group.add(box);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)), new THREE.LineBasicMaterial({color:'#000',transparent:true,opacity:.08}));
  group.add(edge);
  const sp = new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3), new THREE.ShadowMaterial({opacity:.1}));
  sp.rotation.x = -Math.PI/2; sp.position.y = -.505; sp.receiveShadow = true;
  group.add(sp);
  scene.add(group);
  curObj = group;
  const name = BLOCKS[idx].n;
  document.getElementById('info-name').textContent = name;
  // find category
  let cat = '';
  for(const [cname, idxs] of Object.entries(CATS)) {
    if(cname==='全部') continue;
    if(idxs.includes(idx)) { cat = cname; break; }
  }
  document.getElementById('info-cat').textContent = cat;
}

// ---- UI ----
const search = document.getElementById('search');
const catsEl = document.getElementById('cats');
const listEl = document.getElementById('list');
let curCat = '全部';
let shown = [...CATS['全部']];

// Render category tabs
const catNames = Object.keys(CATS);
catsEl.innerHTML = catNames.map(c=>'<span class="cat'+(c===curCat?' sel':'')+'" data-c="'+c+'">'+c+'</span>').join('');

catsEl.onclick = e => {
  const t = e.target.closest('.cat');
  if(!t) return;
  curCat = t.dataset.c;
  catsEl.querySelectorAll('.cat').forEach(c=>c.classList.toggle('sel',c.dataset.c===curCat));
  renderList();
};

search.oninput = () => renderList();

function renderList() {
  const s = search.value.toLowerCase();
  const idxs = CATS[curCat] || CATS['全部'];
  shown = idxs.filter(i=>!s||BLOCKS[i].n.toLowerCase().includes(s));
  document.getElementById('count').textContent = `${shown.length} / ${idxs.length}`;
  listEl.innerHTML = shown.map((i,si)=>{
    const b = BLOCKS[i];
    const x = b.c * (100/(ROWS-1));
    const y = b.r * (100/(ROWS-1));
    const bg = atlasTex ? `background-image:url(${ATLAS_URL});background-size:${ROWS*100}% ${ROWS*100}%;background-position:${x.toFixed(1)}% ${y.toFixed(1)}%` : 'background:#555';
    return '<div class="item'+(si===0?' sel':'')+'" data-i="'+i+'"><div class="thumb" style="'+bg+'"></div>'+b.n+'</div>';
  }).join('');
}

listEl.onclick = e => {
  const item = e.target.closest('.item');
  if(!item) return;
  const i = parseInt(item.dataset.i);
  listEl.querySelectorAll('.item').forEach(el=>el.classList.remove('sel'));
  item.classList.add('sel');
  selectBlock(i);
};

function selectBlock(i) { showBlock(i); }

// Auto rotate
let autoRot = false;
window.toggleRot = function() {
  autoRot = !autoRot;
  controls.autoRotate = autoRot;
  controls.autoRotateSpeed = 2;
  document.getElementById('auto-btn').textContent = '自动旋转: '+(autoRot?'开':'关');
  document.getElementById('auto-btn').classList.toggle('active', autoRot);
};

// Keyboard
window.addEventListener('keydown', e => {
  if(e.key==='f'||e.key==='F') { controls.target.set(0,0,0); camera.position.set(3,2.2,3.5); controls.update(); }
  if(e.key==='r'||e.key==='R') toggleRot();
  if(e.key==='Escape') search.focus();
});

// Resize
function resize() {
  const w = cv.clientWidth, h = cv.clientHeight;
  camera.aspect = w/Math.max(h,1);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  stars.rotation.y += .0001;
  renderer.render(scene, camera);
}
animate();

// Initial
renderList();
if(shown.length) selectBlock(shown[0]);
</script>
