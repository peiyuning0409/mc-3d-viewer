<title>Minecraft 3D 全方块查看器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
    background:linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 30%, #1b2838 60%, #0a0a1a 100%);
    color:#e0e0e0; font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    overflow:hidden; height:100vh; display:flex;
}
#sidebar { 
    width:320px; background:rgba(10,10,26,0.85); backdrop-filter:blur(20px);
    border-right:1px solid rgba(100,150,255,0.15); display:flex; flex-direction:column;
    z-index:10; overflow:hidden;
}
#sidebar-header {
    padding:16px; border-bottom:1px solid rgba(100,150,255,0.15);
    text-align:center;
}
#sidebar-header h1 {
    font-size:20px; background:linear-gradient(135deg,#64b5f6,#42a5f5,#1e88e5);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:2px; margin-bottom:4px;
}
#sidebar-header p { font-size:11px; color:#668; }
#search-box {
    margin:12px; padding:10px 14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(100,150,255,0.2); border-radius:8px;
    color:#e0e0e0; font-size:14px; outline:none; transition:all .3s;
}
#search-box:focus { border-color:rgba(100,150,255,0.5); background:rgba(255,255,255,0.08); }
#category-tabs {
    display:flex; flex-wrap:wrap; gap:4px; padding:0 12px 8px;
}
.cat-tab {
    padding:5px 10px; border-radius:6px; font-size:11px; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1px solid rgba(100,150,255,0.1);
    color:#aab; transition:all .2s; white-space:nowrap;
}
.cat-tab:hover,.cat-tab.active { 
    background:rgba(66,165,245,0.2); border-color:rgba(66,165,245,0.4); color:#fff;
}
#block-list { flex:1; overflow-y:auto; padding:0 8px; }
.block-item {
    display:flex; align-items:center; padding:8px 12px; margin:2px 0;
    border-radius:6px; cursor:pointer; transition:all .15s;
    border:1px solid transparent; font-size:13px;
}
.block-item:hover { background:rgba(66,165,245,0.1); border-color:rgba(66,165,245,0.2); }
.block-item.selected { 
    background:rgba(66,165,245,0.2); border-color:rgba(66,165,245,0.4); color:#fff;
}
.block-color { 
    width:20px; height:20px; border-radius:3px; margin-right:10px;
    flex-shrink:0; box-shadow:0 0 6px rgba(0,0,0,0.3);
}
#main-view { flex:1; position:relative; }
#canvas-container { width:100%; height:100%; }
#info-panel {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    background:rgba(10,10,26,0.85); backdrop-filter:blur(15px);
    border:1px solid rgba(100,150,255,0.2); border-radius:12px;
    padding:12px 24px; text-align:center; pointer-events:none;
}
#info-panel h2 { font-size:18px; color:#64b5f6; }
#info-panel span { font-size:12px; color:#889; }
#view-toolbar {
    position:absolute; top:16px; right:16px; display:flex; gap:8px;
}
.tool-btn {
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12px;
    background:rgba(10,10,26,0.8); border:1px solid rgba(100,150,255,0.2);
    color:#aab; transition:all .2s; backdrop-filter:blur(10px);
}
.tool-btn:hover,.tool-btn.active { 
    background:rgba(66,165,245,0.2); border-color:rgba(66,165,245,0.4); color:#fff;
}
#zoom-hint {
    position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
    font-size:11px; color:#556; pointer-events:none;
}
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(100,150,255,0.2); border-radius:2px; }
</style>
</head>

<div id="sidebar">

// Procedural canvas texture generator
function createBlockTexture(color, special) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // Base color

    for (let i = 0; i < d.length; i += 4) {

        d[i] = Math.min(255, Math.max(0, d[i] + noise));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + noise));

    }
    ctx.putImageData(imageData, 0, 0);
    
    // Special treatments
    if (special === 'planks') {
        // Wood plank lines
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 2;
        for (let y = 0; y < size; y += size/4) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
        }
        // Random plank variation
        for (let i = 0; i < 4; i++) {
            const y = i * size/4;
            ctx.fillStyle = `rgba(${Math.random()>0.5?'255,255,255':'0,0,0'},${Math.random()*0.06})`;
            ctx.fillRect(0, y, size, size/4);
        }
    } else if (special === 'cobble') {
        // Cobblestone pattern
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 3;
        const cells = 4;
        for (let x = 0; x <= cells; x++) {
            const ox = (x / cells) * size + (Math.random() - 0.5) * 20;
            ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, size); ctx.stroke();
        }
        for (let y = 0; y <= cells; y++) {
            const oy = (y / cells) * size + (Math.random() - 0.5) * 20;
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(size, oy); ctx.stroke();
        }
    } else if (special === 'brick') {
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 3;
        const rows = 6;
        for (let r = 0; r < rows; r++) {
            const y = (r / rows) * size;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
            const cols = (r % 2 === 0) ? 4 : 3;
            const offset = (r % 2 === 0) ? 0 : size/(cols*2);
            for (let c = 0; c <= cols; c++) {
                const x = offset + (c / cols) * size;
                if ((r % 2 === 0) || (c > 0 && c < cols)) {
                    ctx.beginPath(); ctx.moveTo(x, y-size/rows); ctx.lineTo(x, y); ctx.stroke();
                }
            }
        }
    } else if (special === 'log') {
        // Tree rings
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        for (let i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.arc(size/2, size/2, size * (0.05 + i * 0.06), 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1 + Math.random() * 2;
            ctx.stroke();
        }
    } else if (special === 'ore') {
        // Ore spots
        for (let i = 0; i < 20; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = 5 + Math.random() * 15;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
        }
    } else if (special === 'glass') {
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(0, 0, size, size);
        ctx.globalAlpha = 1;
        // Glass streaks
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
            const x = size * 0.2 + Math.random() * size * 0.3;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 20, size); ctx.stroke();
        }
    } else if (special === 'glowstone') {
        // Bright spots
        const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/1.5);
        gradient.addColorStop(0, 'rgba(255,255,200,0.3)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.1)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
    } else if (special === 'bookshelf') {
        ctx.fillStyle = '#8b6e4a';
        ctx.fillRect(0, 0, size, size);
        for (let row = 0; row < 4; row++) {
            const y = row * size/4 + 4;
            const h = size/4 - 8;
            // Books with different colors
            const bookColors = ['#c83030','#309030','#3030c0','#c09030','#9030c0','#30c090'];
            for (let col = 0; col < 6; col++) {
                const x = col * size/6 + 3;
                const w = size/6 - 6;
                ctx.fillStyle = bookColors[(row+col)%bookColors.length];
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.strokeRect(x, y, w, h);
            }
        }
    } else if (special === 'tnt') {
        ctx.fillStyle = '#c82818';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(size*0.15, 0, size*0.7, size*0.3);
        ctx.fillRect(0, size*0.35, size, size*0.3);
        ctx.fillRect(size*0.15, size*0.65, size*0.7, size*0.35);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.font = 'bold ' + size*0.18 + 'px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('TNT', size/2, size*0.62);
    } else if (special === 'leaves') {
        for (let i = 0; i < 60; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = 8 + Math.random() * 12;
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.3 + Math.random() * 0.4;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    } else if (special === 'magma') {
        ctx.fillStyle = '#602010';
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 40; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = 3 + Math.random() * 8;
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, 'rgba(255,180,20,0.9)');
            grad.addColorStop(0.5, 'rgba(255,80,10,0.6)');
            grad.addColorStop(1, 'rgba(200,20,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
        }
    } else if (special === 'pillar') {
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 3;
        for (let x = 0; x <= size; x += size/5) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, x); ctx.lineTo(size, x); ctx.stroke();
        }
    } else if (special === 'target') {
        ctx.fillStyle = '#c8c8c8';
        ctx.fillRect(0, 0, size, size);
        const rings = ['#e8e8e8','#d0d0d0','#c0c0c0','#e8e8e8','#c82818'];
        for (let i = rings.length-1; i >= 0; i--) {
            const r = size * (0.1 + i * 0.08);
            ctx.fillStyle = rings[i];
            ctx.beginPath(); ctx.arc(size/2, size/2, r, 0, Math.PI*2); ctx.fill();
        }
    } else if (special === 'crying_obsidian') {
        ctx.fillStyle = '#1a1030';
        ctx.fillRect(0, 0, size, size);
        // Purple glow cracks
        for (let i = 0; i < 15; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const grad = ctx.createRadialGradient(x, y, 0, x, y, 8 + Math.random()*8);
            grad.addColorStop(0, 'rgba(160,60,220,0.8)');
            grad.addColorStop(1, 'rgba(160,60,220,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(x, y, 10 + Math.random()*10, 0, Math.PI*2); ctx.fill();
        }
    } else if (special === 'ender_chest') {
        ctx.fillStyle = '#1a2040';
        ctx.fillRect(0, 0, size, size);
        // Eye pattern
        ctx.fillStyle = '#40e8e8';
        ctx.beginPath(); ctx.arc(size/2, size/2, size*0.25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a2040';
        ctx.beginPath(); ctx.arc(size/2, size/2, size*0.12, 0, Math.PI*2); ctx.fill();
    } else if (special === 'respawn_anchor') {
        ctx.fillStyle = '#1a1030';
        ctx.fillRect(0, 0, size, size);
        const glow = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        glow.addColorStop(0, 'rgba(200,60,200,0.5)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);
    }
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.generateMipmaps = true;
    return tex;
}

function createBlockMesh(block) {
    if (currentBlockMesh) {
        scene.remove(currentBlockMesh);
        disposeMesh(currentBlockMesh);
    }
    
    const group = new THREE.Group();
    
    // Create 6-face box
    const size = 1;
    const topTex = createBlockTexture(block.top, block.special);
    const sideTex = createBlockTexture(block.side, block.special);
    const bottomTex = createBlockTexture(block.bottom, block.special);
    
    const materials = [
        new THREE.MeshStandardMaterial({map:sideTex, roughness:0.6, metalness:0.05}), // right
        new THREE.MeshStandardMaterial({map:sideTex, roughness:0.6, metalness:0.05}), // left
        new THREE.MeshStandardMaterial({map:topTex, roughness:0.6, metalness:0.05}),  // top
        new THREE.MeshStandardMaterial({map:bottomTex, roughness:0.7, metalness:0.05}), // bottom
        new THREE.MeshStandardMaterial({map:sideTex, roughness:0.6, metalness:0.05}), // front
        new THREE.MeshStandardMaterial({map:sideTex, roughness:0.6, metalness:0.05}), // back
    ];
    
    const boxGeo = new THREE.BoxGeometry(size, size, size, 2, 2, 2);
    const boxMesh = new THREE.Mesh(boxGeo, materials);
    boxMesh.castShadow = true;
    boxMesh.receiveShadow = true;
    group.add(boxMesh);
    
    // Add subtle edge highlight
    const edgeGeo = new THREE.EdgesGeometry(boxGeo);
    const edgeMat = new THREE.LineBasicMaterial({color:'rgba(0,0,0,0.15)', transparent:true, opacity:0.3});
    const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
    group.add(edgeLine);
    
    // Reflection plane (slight shine)
    const planeGeo = new THREE.PlaneGeometry(size*1.2, size*1.2);
    const planeMat = new THREE.ShadowMaterial({opacity:0.15});
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI/2;
    plane.position.y = -size/2 - 0.01;
    plane.receiveShadow = true;
    group.add(plane);
    
    scene.add(group);
    currentBlockMesh = group;
    return group;
}

function disposeMesh(mesh) {
    mesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            if (Array.isArray(child.material)) {
                child.material.forEach(m => { if(m.map) m.map.dispose(); m.dispose(); });
            } else {
                if (child.material.map) child.material.map.dispose();
                child.material.dispose();
            }
        }
    });
}

// Scene for biomes
let biomeMeshes = [];
function createBiomeScene(biomeName) {
    if (currentBlockMesh) { scene.remove(currentBlockMesh); disposeMesh(currentBlockMesh); currentBlockMesh = null; }
    biomeMeshes.forEach(m => { scene.remove(m); disposeMesh(m); });
    biomeMeshes = [];
    
    // Create a small terrain patch
    const group = new THREE.Group();
    const groundColor = getBiomeColor(biomeName);
    const groundTex = createBlockTexture(groundColor, '');
    
    // Ground
    const groundGeo = new THREE.PlaneGeometry(4, 4);
    const groundMat = new THREE.MeshStandardMaterial({map:groundTex, roughness:0.8, metalness:0});
    const groundPlane = new THREE.Mesh(groundGeo, groundMat);
    groundPlane.rotation.x = -Math.PI/2;
    groundPlane.position.y = -0.75;
    groundPlane.receiveShadow = true;
    group.add(groundPlane);
    
    // Decorative blocks
    const blockColors = getBiomeBlocks(biomeName);
    for (let i = 0; i < 6; i++) {
        const bGeo = new THREE.BoxGeometry(0.3, 0.3 + Math.random()*0.4, 0.3);
        const bTex = createBlockTexture(blockColors[i % blockColors.length], '');
        const bMat = new THREE.MeshStandardMaterial({map:bTex, roughness:0.7});
        const b = new THREE.Mesh(bGeo, bMat);
        b.position.set((Math.random()-0.5)*3, -0.6 + Math.random()*0.3, (Math.random()-0.5)*3);
        b.castShadow = true;
        b.receiveShadow = true;
        group.add(b);
    }
    
    // label
    scene.add(group);
    biomeMeshes.push(group);
    document.getElementById('info-name').textContent = biomeName;
    document.getElementById('info-cat').textContent = '群系';
}

function getBiomeColor(name) {
    const map = {
        '平原':'#7c9e3c','沙漠':'#dcc890','森林':'#4a7a2e','黑森林':'#2a4a1a',
        '针叶林':'#5a7a3a','积雪针叶林':'#e8f0e8','热带草原':'#a89040',
        '丛林':'#3a8a1a','竹林':'#6a9a30','恶地':'#c87030','蘑菇岛':'#805870',
        '沼泽':'#4a5a30','海洋':'#2848a0','深海':'#183880','河流':'#3868c0',
        '海滩':'#dcc890','石岸':'#707070','雪山':'#f0f8ff','冻原':'#e0e8f0',
        '下界荒地':'#602020','绯红森林':'#802040','诡异森林':'#206060',
        '灵魂沙峡谷':'#382818','玄武岩三角洲':'#3a3a3e','末地':'#d9dda0',
        '樱花树林':'#c08898','红树林沼泽':'#603820','溶洞':'#686860'
    };
    return map[name] || '#7a7a7a';
}

function getBiomeBlocks(name) {
    const map = {
        '平原':['#7c9e3c','#8b6914','#a0c828'],
        '沙漠':['#dcc890','#c4b07c','#e8d4a0'],
        '森林':['#4a7a2e','#6b8e2e','#8b6914'],
        '下界荒地':['#602020','#4a1a1a','#803838'],
        '末地':['#d9dda0','#c4c890','#e2e6ae'],
        '海洋':['#2848a0','#3870c0','#4888d8'],
        '雪山':['#f0f8ff','#e0e8f0','#d0d8e8'],
        '恶地':['#c87030','#b06020','#d88040'],
        '丛林':['#3a8a1a','#2a6a0e','#4a9a2a'],
    };
    return map[name] || ['#7a7a7a','#8b8b8b'];
}

function createStructureScene(name) {
    if (currentBlockMesh) { scene.remove(currentBlockMesh); disposeMesh(currentBlockMesh); currentBlockMesh = null; }
    biomeMeshes.forEach(m => { scene.remove(m); disposeMesh(m); });
    biomeMeshes = [];
    
    const group = new THREE.Group();
    if (name === '末地堡垒') {
        // End city towers
        const pillarMat = new THREE.MeshStandardMaterial({map:createBlockTexture('#e2e6ae', ''), roughness:0.6});
        const purpurMat = new THREE.MeshStandardMaterial({map:createBlockTexture('#ab80b8', ''), roughness:0.5});
        for (let i = 0; i < 3; i++) {
            const x = (i-1)*1.2;
            const h = 1.5 + i*0.3;
            const pillarGeo = new THREE.CylinderGeometry(0.15, 0.2, h, 8);
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(x, -0.75 + h/2, 0);
            pillar.castShadow = true;
            group.add(pillar);
            // Purpur top
            const topGeo = new THREE.BoxGeometry(0.35, 0.2, 0.35);
            const top = new THREE.Mesh(topGeo, purpurMat);
            top.position.set(x, -0.75 + h + 0.1, 0);
            top.castShadow = true;
            group.add(top);
        }
    } else if (name === '下界要塞') {
        const brickMat = new THREE.MeshStandardMaterial({map:createBlockTexture('#4d1f1f', 'brick'), roughness:0.7});
        for (let i = 0; i < 4; i++) {
            const pillarGeo = new THREE.BoxGeometry(0.2, 2, 0.2);
            const pillar = new THREE.Mesh(pillarGeo, brickMat);
            pillar.position.set((i-1.5)*0.8, -0.75+1, 0);
            pillar.castShadow = true;
            group.add(pillar);
        }
        const bridgeGeo = new THREE.BoxGeometry(2.4, 0.15, 0.8);
        const bridge = new THREE.Mesh(bridgeGeo, brickMat);
        bridge.position.y = -0.75+2.1;
        bridge.castShadow = true;
        group.add(bridge);
    } else if (name === '海底神殿') {
        const prisMat = new THREE.MeshStandardMaterial({map:createBlockTexture('#78a89c', ''), roughness:0.5, metalness:0.2});
        const baseGeo = new THREE.BoxGeometry(2, 0.5, 2);
        const base = new THREE.Mesh(baseGeo, prisMat);
        base.position.y = -0.5;
        base.castShadow = true;
        group.add(base);
        const midGeo = new THREE.BoxGeometry(1.5, 1, 1.5);
        const mid = new THREE.Mesh(midGeo, prisMat);
        mid.position.y = 0.25;
        mid.castShadow = true;
        group.add(mid);
        const topGeo = new THREE.ConeGeometry(0.8, 0.6, 4);
        const topMesh = new THREE.Mesh(topGeo, prisMat);
        topMesh.position.y = 1.05;
        topMesh.rotation.y = Math.PI/4;
        topMesh.castShadow = true;
        group.add(topMesh);
    } else {
        // Generic structure
        const colors = ['#6f6f6f','#b8905c','#707070','#8b6914'];
        for (let i = 0; i < 5; i++) {
            const bGeo = new THREE.BoxGeometry(0.3, 0.3 + Math.random()*0.8, 0.3);
            const bTex = createBlockTexture(colors[i%4], i%2?'brick':'');
            const bMat = new THREE.MeshStandardMaterial({map:bTex, roughness:0.7});
            const b = new THREE.Mesh(bGeo, bMat);
            b.position.set((Math.random()-0.5)*2, -0.6 + Math.random()*1, (Math.random()-0.5)*2);
            b.castShadow = true;
            group.add(b);
        }
    }
    scene.add(group);
    biomeMeshes.push(group);
    document.getElementById('info-name').textContent = name;
    document.getElementById('info-cat').textContent = '建筑';
}

// UI Logic
let currentCategory = '全部';
const categories = [...new Set(blockData.map(b => b.category))];

function renderCategoryTabs() {
    const container = document.getElementById('category-tabs');
    const allTabs = ['全部', ...categories];
    container.innerHTML = allTabs.map(c => 
        `<span class="cat-tab${c===currentCategory?' active':''}" onclick="setCategory('${c}')">${c}</span>`
    ).join('');
}

function renderBlockList() {
    const search = document.getElementById('search-box').value.toLowerCase();
    const list = document.getElementById('block-list');
    
    let filtered = blockData;
    if (currentCategory !== '全部') {
        filtered = filtered.filter(b => b.category === currentCategory);
    }
    if (search) {
        filtered = filtered.filter(b => b.name.toLowerCase().includes(search));
    }
    
    list.innerHTML = filtered.map((b, i) => 
        `<div class="block-item" onclick="selectBlock(${i}, '${b.name}')" data-idx="${i}">
            <div class="block-color" style="background:${b.side}"></div>
            <span>${b.name}</span>
        </div>`
    ).join('');
    
    // Cache filtered list
    window._filtered = filtered;
}

function setCategory(cat) {
    currentCategory = cat;
    renderCategoryTabs();
    renderBlockList();
}

function filterBlocks() { renderBlockList(); }

function selectBlock(idx, name) {
    document.querySelectorAll('.block-item').forEach(el => el.classList.remove('selected'));
    const item = document.querySelector(`[data-idx="${idx}"]`);
    if (item) item.classList.add('selected');
    
    const block = window._filtered[idx];
    if (block) {
        // Clear biome/structures
        biomeMeshes.forEach(m => { scene.remove(m); disposeMesh(m); });
        biomeMeshes = [];
        createBlockMesh(block);
        document.getElementById('info-name').textContent = block.name;
        document.getElementById('info-cat').textContent = block.category;
        setView('block');
    }
}

function setView(view) {
    currentView = view;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    if (view === 'block') {
        document.querySelector('.tool-btn:nth-child(1)').classList.add('active');
    } else if (view === 'biome') {
        document.querySelector('.tool-btn:nth-child(2)').classList.add('active');
        // Show biome list via block list
        currentCategory = '全部';
        const container = document.getElementById('block-list');
        container.innerHTML = biomeData.map((b, i) => 
            `<div class="block-item" onclick="showBiome('${b}')">
                <div class="block-color" style="background:${getBiomeColor(b)}"></div>
                <span>${b}</span>
            </div>`
        ).join('');
    } else if (view === 'structure') {
        document.querySelector('.tool-btn:nth-child(3)').classList.add('active');
        const container = document.getElementById('block-list');
        container.innerHTML = structureData.map((s, i) => 
            `<div class="block-item" onclick="showStructure('${s}')">
                <div class="block-color" style="background:#555"></div>
                <span>${s}</span>
            </div>`
        ).join('');
    }
}

window.showBiome = function(name) { createBiomeScene(name); };
window.showStructure = function(name) { createStructureScene(name); };

function toggleWireframe() {
    wireframe = !wireframe;
    scene.traverse(child => {
        if (child.isMesh && child.material.isMeshStandardMaterial) {
            child.material.wireframe = wireframe;
        }
    });
    document.querySelectorAll('.tool-btn')[3].classList.toggle('active', wireframe);
}

function toggleGrid() {
    showGrid = !showGrid;
    gridHelper.visible = showGrid;
    document.querySelectorAll('.tool-btn')[4].classList.toggle('active', !showGrid);
}

// Initialize
renderCategoryTabs();
renderBlockList();

// Auto-select first block
setTimeout(() => {
    if (blockData.length > 0) {
        window._filtered = blockData;
        selectBlock(0, blockData[0].name);
    }
}, 100);

// Resize handler
function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

// Animation loop
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    // Subtle star rotation
    stars.rotation.y += 0.0001;
    renderer.render(scene, camera);
}
animate();

// Keyboard shortcuts
window.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') {
        controls.target.set(0, 0.5, 0);
        camera.position.set(2.5, 2, 3);
        controls.update();
    }
    if (e.key === 'r' || e.key === 'R') {
        // Reset rotation
        controls.autoRotate = !controls.autoRotate;
        controls.autoRotateSpeed = 2;
    }
});

console.log('Minecraft 3D Viewer Ready -', blockData.length, 'blocks |', biomeData.length, 'biomes |', structureData.length, 'structures');
